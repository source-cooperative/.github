name: Claude Auto Review

on:
  pull_request:
    # No ready_for_review: drafts are already reviewed on opened/synchronize, so
    # flipping to ready re-runs the same review against an unchanged diff.
    types: [opened, synchronize, reopened]
    # Skip when a PR touches workflow files: the action can't validate/run
    # against modified workflows and fails with "401 Unauthorized - Workflow
    # validation failed".
    paths-ignore:
      - '.github/workflows/**'

jobs:
  review:
    uses: source-cooperative/.github/.github/workflows/claude-pr-review.yml@main
    # All inputs are optional:
    # with:
    #   ponytail: false            # drop the over-engineering pass
    #   plugins: |                 # install your own plugins...
    #     my-plugin@my-marketplace
    #   plugin_marketplaces: |
    #     https://github.com/my-org/my-marketplace.git
    #   extra_instructions: |      # ...and tell the reviewer to use them
    #     Also apply the my-plugin review skill.
    #   show_cost: false           # hide the cost footer on the comment
    #   model: claude-opus-4-8     # review model (default: Claude Code default)
    # Granted here because a called workflow can only maintain or reduce the
    # caller's token permissions, never elevate them.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Mapped explicitly rather than `secrets: inherit` so the review job gets
    # only this token, not every secret the repo has. Picks up the org-level
    # CLAUDE_CODE_OAUTH_TOKEN (see
    # https://github.com/source-cooperative/.github#claude-pr-review); a
    # repo-level secret of the same name shadows it.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
